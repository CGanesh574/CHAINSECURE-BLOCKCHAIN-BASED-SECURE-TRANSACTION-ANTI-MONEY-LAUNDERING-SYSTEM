<!DOCTYPE html>
<html>
<head>
    <title>Test Registration</title>
</head>
<body>
    <h1>Test Registration Form</h1>
    <form id="testForm">
        <input type="text" id="name" placeholder="Name" value="Test User"><br>
        <input type="email" id="email" placeholder="Email" value="testuser@example.com"><br>
        <input type="password" id="password" placeholder="Password" value="test123"><br>
        <input type="text" id="phone" placeholder="Phone" value="1234567890"><br>
        <input type="number" id="age" placeholder="Age" value="25"><br>
        <select id="gender">
            <option value="Male">Male</option>
            <option value="Female">Female</option>
        </select><br>
        <input type="text" id="wallet" placeholder="Wallet Address (optional)" value=""><br>
        <button type="submit">Register</button>
    </form>
    <div id="result"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                phone: document.getElementById('phone').value,
                age: parseInt(document.getElementById('age').value),
                gender: document.getElementById('gender').value,
                walletAddress: document.getElementById('wallet').value
            };

            try {
                const response = await fetch('http://localhost:5000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                document.getElementById('result').innerHTML = '<pre>' + JSON.stringify(result, null, 2) + '</pre>';
            } catch (error) {
                document.getElementById('result').innerHTML = '<pre>Error: ' + error.message + '</pre>';
            }
        });
    </script>
</body>
</html>
